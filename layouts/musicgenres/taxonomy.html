{{ define "main" }}
<div class="list-page">
    <div class="container">
        <header class="section-header">
            <h1>{{ .Title }}</h1>
        </header>
        <ul class="music-genres music-genres-index">
            {{ range .Pages.ByTitle }}
            <li><a href="{{ .RelPermalink }}">{{ .Title }} ({{ len .Pages }})</a></li>
            {{ end }}
        </ul>
    </div>
</div>
{{ end }}

{{- if not .IsHome -}}
{{- $pages := partial "breadcrumb-pages.html" . -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {{- range $i, $page := $pages }}{{ if $i }},{{ end }}
    {
      "@type": "ListItem",
      "position": {{ add $i 1 }},
      "name": {{ $page.Title | jsonify | safeJS }},
      "item": {{ $page.Permalink | jsonify | safeJS }}
    }
    {{- end }}
  ]
}
</script>
{{- end -}}

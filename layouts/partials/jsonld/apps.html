{{- $apps := sort hugo.Data.apps "position" -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "name": {{ .Title | jsonify | safeJS }},
  "url": {{ .Permalink | jsonify | safeJS }},
  "itemListElement": [
    {{- range $i, $app := $apps }}{{ if $i }},{{ end }}
    {
      "@type": "ListItem",
      "position": {{ add $i 1 }},
      "item": {
        "@type": "SoftwareApplication",
        {{ partial "jsonld/app-fields.html" $app }}
      }
    }
    {{- end }}
  ]
}
</script>

{{- define "main" }}
{{- $imageURL := partial "page-image-url.html" . }}
<article class="single-post">
    <div class="container">
        <header class="post-header">
            <h1>{{ .Title }}</h1>
            {{ partial "post-meta.html" . }}
        </header>

        {{- if $imageURL }}
        <div class="post-illustration">
            <img src="{{ $imageURL }}" alt="{{ .Title }}">
        </div>
        {{- end }}

        <div class="post-content">
            {{ .Content }}
        </div>
    </div>
</article>
{{- end }}

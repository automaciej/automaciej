{{- define "main" }}
<div class="list-page">
    <div class="container container-wide">
        <header class="section-header">
            <h1>{{ .Title }}</h1>
            {{- with .Content }}
            <div class="section-intro card">
                {{ . }}
            </div>
            {{- end }}
        </header>

        <div class="apps-list">
            {{- range partial "apps-list.html" . }}
            {{ partial "app-card.html" . }}
            {{- end }}
        </div>
    </div>
</div>
{{- end }}

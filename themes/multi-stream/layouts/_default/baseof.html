<!DOCTYPE html>
<html lang="{{ if eq .Section "jogger" }}pl{{ else }}{{ .Site.Language.Lang }}{{ end }}">
<head>
  {{ partial "head.html" . }}
  {{ block "head_extra" . }}{{ partial "og-tags-default.html" . }}{{ end }}
</head>
<body>
    {{ partial "header.html" . }}

    <main>
        {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}

    <script>
        // Mobile navigation toggle
        document.addEventListener('DOMContentLoaded', function() {
            const navToggle = document.querySelector('.nav-toggle');
            const navMenu = document.querySelector('.nav-menu');

            if (navToggle && navMenu) {
                navToggle.addEventListener('click', function() {
                    navToggle.classList.toggle('active');
                    navMenu.classList.toggle('active');
                });

                // Close menu when clicking outside
                document.addEventListener('click', function(event) {
                    if (!event.target.closest('.site-nav')) {
                        navToggle.classList.remove('active');
                        navMenu.classList.remove('active');
                    }
                });

                // Close menu when clicking a link
                navMenu.querySelectorAll('a').forEach(link => {
                    link.addEventListener('click', function() {
                        navToggle.classList.remove('active');
                        navMenu.classList.remove('active');
                    });
                });
            }
        });

        // Share button: native share sheet, falling back to copy-link
        document.querySelectorAll('.share-button').forEach(function (btn) {
            if (navigator.share) {
                btn.textContent = '📤 Share';
            }
            btn.addEventListener('click', function () {
                var shareData = { title: document.title, url: window.location.href };
                if (navigator.share) {
                    navigator.share(shareData).catch(function () {});
                } else if (navigator.clipboard) {
                    navigator.clipboard.writeText(shareData.url).then(function () {
                        var original = btn.textContent;
                        btn.textContent = 'Copied!';
                        btn.classList.add('copied');
                        setTimeout(function () {
                            btn.textContent = original;
                            btn.classList.remove('copied');
                        }, 1500);
                    });
                }
            });
        });
    </script>
</body>
</html>

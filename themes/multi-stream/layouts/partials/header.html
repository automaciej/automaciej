<header class="site-header">
    <div class="container">
        <nav class="site-nav">
            {{ if and .IsPage (ne .CurrentSection .Site.Home) }}
                <a href="{{ .CurrentSection.Permalink }}" class="site-title">{{ .CurrentSection.Title }}</a>
            {{ else }}
                <a href="{{ "/" | relURL }}" class="site-title">{{ .Site.Title }}</a>
            {{ end }}
            <button class="nav-toggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-menu">
                {{ range .Site.Menus.main }}
                <li><a href="{{ .URL | absLangURL }}">{{ .Name }}</a></li>
                {{ end }}
            </ul>
        </nav>
    </div>
</header>

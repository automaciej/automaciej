defaultContentLanguage = "en"
locale = "en"
title = "Maciej Bliziński"
baseurl = "https://blizin.ski"
theme = "multi-stream"
rssLimit = 50
enableGitInfo = true
copyright = "&copy;2026 Maciej Bliziński"
[author]
  [author.maciej]
    name = "Maciej Bliziński"
    email = "maciej.blizinski@gmail.com"

[taxonomies]
  tag = "tags"
  genre = "genres"

[permalinks]
  jogger = "/jogger/:year/:contentbasename/"
  blog = "/blog/:year/:contentbasename/"
  page = "/:contentbasename/"

[[menu.main]]
  name = "Bio"
  url = "/bio/"
  weight = 10
  title = "Maciej's Bio"
[[menu.main]]
  name = "Music"
  url = "/music/"
  weight = 20
  title = "Music production"
[[menu.main]]
  name = "Apps"
  url = "/apps/"
  weight = 30
  title = "Maciej's apps"
[[menu.main]]
  name = "Blog"
  url = "/blog/"
  weight = 40
  title = "English blog"
[[menu.main]]
  name = "Live"
  url = "/music/performances/"
  weight = 50
  title = "Live performances"
[[menu.main]]
  name = "Jogger"
  url = "/jogger/"
  weight = 60
  title = "Polish blog"

[params]
  authorName = "Maciej Bliziński"
  authorEmail = "maciej.blizinski@gmail.com"
  siteLogo = "/images/automaciej-logo.jpg"
  description = "Dublin-based musician and software engineer."
  shareImage = "bio/images/maciej_on_bass_hi.jpg"
  favicon = "images/favicon.png"

[params.social]
  linktree = "mblizinski"
  instagramHandle = "mblizinski"
  mastodonLink = "https://mastodon.ie/@automaciej"
  githubName = "automaciej"
  tiktokName = "automaciej"
  facebookUrlPath = "maciej.blizinski"
  twitterHandle = "automaciej"
  soundcloud = "maciej-blizinski"
  linkedIn = "automaciej"
  bluesky = "https://bsky.app/profile/blizin.ski"

[params.visual]
  [params.visual.image]
    enable = true
    file = "images/background.jpg"

[blackfriday]
  # W przypisach mamy rzeczy typu "2010/4" które są formami dat.
  fractions = false
[imaging.exif]
  includeFields = ".*"

